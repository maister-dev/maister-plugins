schemaVersion: 1
name: pstack-feature
metadata:
  title: "pstack — Feature"
  summary: "Multi-model design consensus followed by shape-first implementation, independent verification, bounded review, and approval."
  labels: [feature, design, delivery]
  route_when: "New or changed behavior needs a named data shape and evidence-backed implementation."
  links:
    - {
        kind: framework,
        title: "pstack feature playbook",
        url: "https://github.com/cursor/plugins/blob/main/pstack/skills/poteto-mode/playbooks/feature.md",
      }
runner_profiles:
  primary:
    capability_agent: claude
    effort: high
  independent:
    capability_agent: codex
    effort: high
# 3.8.0: the engine renders the consensus `prompt` for the draft participants;
# below it they receive `{{ task.prompt }}` as literal text.
compat:
  engine_min: 3.8.0
defaults:
  session_policy: resume
sessions:
  implement: { runner: primary }
  verify: { runner: independent }
  finalize: { runner: primary }
nodes:
  - id: design
    type: consensus
    prompt: |
      [MAIster x pstack execution contract]
      Work non-interactively and read-only. Do not ask questions, edit files,
      invoke Cursor Task subagents or /loop, use pstack global model rules, or
      perform git/PR side effects. MAIster owns orchestration and the workspace.

      Design the smallest complete implementation for: {{ task.prompt }}

      Follow the pstack feature playbook. Use `how`, `why`, `blast-radius`, and
      relevant principle skills. Start from an explicit named data shape and
      trace it through boundaries, state ownership, errors, observability, tests,
      and migration concerns. Reject speculative abstractions and list concrete
      acceptance checks.
    participants:
      - { id: implementation-design, runner: primary }
      - { id: adversarial-design, runner: independent }
    workspace:
      mode: repo_read
    material_axes:
      - data_shape_is_explicit
      - boundaries_are_traced
      - scope_is_minimal_and_complete
      - verification_is_executable
    rounds:
      mode: iterate
      max: 2
    on_no_consensus: escalate
    synthesizer:
      runner: primary
    output:
      produces:
        - { id: consensus_plan, kind: plan, current: true }
        - { id: debate_log, kind: human_note, current: true }
    transitions:
      success: implement

  - id: implement
    type: ai_coding
    session: implement
    action:
      prompt: |
        [MAIster x pstack execution contract]
        Implement non-interactively in the current MAIster worktree. Do not use
        Cursor-native orchestration, create/switch worktrees or branches, push,
        merge, open a PR, or commit yet.

        Execute the consensus plan for {{ task.prompt }}. Use `tdd`,
        `blast-radius`, `no-comments`, `unslop`, and applicable principle
        skills. Keep the named data shape visible across boundaries, add only
        tests that prove requested behavior, and avoid unrelated refactors.

        Rework feedback, if present: {{ review_comments }}
    input:
      requires:
        - { artifact: consensus_plan, kind: plan, inline: true }
    output:
      produces:
        - {
            id: impl-diff,
            kind: diff,
            current: true,
            requiredFor: [review, merge],
          }
    transitions:
      success: verify

  - id: verify
    type: judge
    session: verify
    action:
      prompt: |
        Independently verify the implementation without editing it. Run fresh,
        relevant project checks; exercise the requested behavior and important
        boundaries. Compare the diff to the consensus plan. End with one fenced
        `json maister:output` object:
        {
          "verdict": "pass" | "fail" | "blocked",
          "summary": "...",
          "commands": [],
          "evidence": {}
        }
    input:
      requires:
        - { artifact: consensus_plan, kind: plan, inline: true }
        - { artifact: impl-diff, kind: diff }
    output:
      result:
        schema: ./schemas/verification-result.v1.json
        required: true
        on_mismatch: retry
      produces:
        - { id: verification, kind: test_report, current: true }
    decide:
      from: output.verdict
    transitions:
      pass: review
      fail: fix
      blocked: approval
      exhausted: approval
    rework:
      allowedTargets: [fix]
      workspacePolicies: [keep]
      maxLoops: 3
      session_policy: new_session
      commentsVar: review_comments
      onExhaustion: exhausted

  - id: review
    type: judge
    session: verify
    action:
      prompt: |
        Review the implementation against the task, consensus plan, and fresh
        verification. Use pstack `blast-radius`, `no-comments`, `unslop`, and
        relevant principle rubrics. Stay read-only. End with one fenced
        `json maister:output` object:
        {
          "recommendation": "accept" | "rework",
          "summary": "...",
          "issues": [],
          "evidence": {}
        }
    input:
      requires:
        - { artifact: impl-diff, kind: diff }
        - { artifact: verification, kind: test_report, inline: true }
    output:
      result:
        schema: ./schemas/review-result.v1.json
        required: true
        on_mismatch: retry
      produces:
        - { id: independent-review, kind: ai_judgment, current: true }
    decide:
      from: output.recommendation
    transitions:
      accept: approval
      rework: fix
      exhausted: approval
    rework:
      allowedTargets: [fix]
      workspacePolicies: [keep]
      maxLoops: 3
      session_policy: new_session
      commentsVar: review_comments
      onExhaustion: exhausted

  - id: fix
    type: ai_coding
    session: implement
    action:
      prompt: |
        Address only the concrete verification or review failures in
        {{ review_comments }}. Re-check them against the task and consensus plan,
        use pstack's `tdd` and change-discipline principles, and keep unrelated
        code untouched. Do not commit or perform branch/PR operations.
    input:
      requires:
        - { artifact: consensus_plan, kind: plan, inline: true }
    transitions:
      success: verify

  - id: approval
    type: human
    input:
      requires:
        - { artifact: impl-diff, kind: diff }
        - { artifact: verification, kind: test_report }
        - { artifact: independent-review, kind: ai_judgment }
    finish:
      human:
        role: maintainer
        decisions: [approve, rework, takeover]
        commentsVar: review_comments
    transitions:
      approve: finalize
      rework: fix
      takeover: verify
    rework:
      allowedTargets: [fix]
      workspacePolicies: [keep, rewind-to-node-checkpoint]
      maxLoops: 3
      session_policy: new_session
      commentsVar: review_comments
      resetTargets: [verify, review]

  - id: finalize
    type: ai_coding
    session: finalize
    action:
      prompt: |
        Run the relevant verification one final time with fresh output. Commit
        all requested tracked changes locally using a conventional commit. Do
        not push, merge, open a PR, switch branches, or remove the worktree;
        MAIster owns promotion. Stop with a clean tracked worktree.
    pre_finish:
      gates:
        - id: tree-clean
          kind: command_check
          mode: blocking
          command: 'test -z "$(git status --porcelain --untracked-files=no)"'
    transitions:
      success: done
