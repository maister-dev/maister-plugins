schemaVersion: 1
name: tea-nfr
metadata:
  title: "TEA — NFR Audit"
  summary: "Murat audits implemented non-functional-requirement evidence (security, performance, reliability, …) and recommends actions, then a human review gate. Produces an NFR assessment under docs/test-artifacts/."
  labels: [testing, quality, nfr, tea, bmad]
  route_when: "Audit non-functional-requirement evidence for a feature and recommend actions."
  links:
    - { kind: framework, title: "BMAD Test Architect", url: "https://github.com/bmad-code-org/bmad-method-test-architecture-enterprise" }
  sources:
    - { component: "capability/skills/bmad-tea-nfr", origin: "github.com/bmad-code-org/bmad-method-test-architecture-enterprise@v4.3.1" }
runner_profiles:
  claude-code:
    capability_agent: claude
    adapter: claude
    model: claude-opus-4-8
    provider:
      kind: anthropic
# Pinned to the M42 2.0.0 engine baseline for this package release (single
# reused default session; no sessions: map needed).
compat:
  engine_min: 3.7.0
defaults:
  session_policy: resume
requirements:
  - name: "uv with Python 3.11+"
    probe: "command -v uv"
    hint: "install uv and ensure Python 3.11 or newer is available"
result:
  export:
    schema: ./schemas/public-result.v1.json
    from: [work]
    required: true
verdict_calibration:
  confidence_min: 0.7
nodes:
  - id: substrate
    type: cli
    action:
      command: '.claude/skills/bmad-tea-runtime-support/prepare.sh "{{ run.projectSlug }}"'
    transitions:
      success: work

  - id: work
    type: ai_coding
    settings:
      agent: bmad-tea:murat-test-architect
      permissionMode: allow
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        [MAIster x BMAD — execution contract]
        You run NON-INTERACTIVELY inside MAIster, in an isolated git worktree on the correct branch. AskUserQuestion is DISABLED — never ask the user; make best-judgment decisions; corrections arrive via the HITL review gate. MAIster owns git + promotion: commit locally only; do NOT create worktrees/branches, merge, push, or open PRs. Inside any BMad skill, run the configuration and customization steps and skip the interactive greeting and menu. Resolve core and modules.tea from _bmad/config.toml, including team and user overrides. Follow the workflow migration checks before starting work.

        THIS NODE — NFR evidence audit:
        - Scope / task: {{ task.prompt }}
        - Drive the `bmad-tea-nfr` skill autonomously: assess the implemented non-functional-requirement evidence (security, performance, reliability, maintainability, …) and recommend actions. Write the audit under docs/test-artifacts/. No placeholders.
        - Commit locally (e.g. "docs(tea): NFR audit"). STOP after the artifact — the next node reviews it.
        - End with exactly one result block:
          ```json maister:output
          {"summary":"...","outcome":"completed","payload":{"artifacts":[],"nfrStatuses":{},"risks":[],"recommendation":{}}}
          ```

        Reviewer feedback from a prior review (empty on first pass):
        {{ review_comments }}
    pre_finish:
      gates:
        - id: artifact-written
          kind: command_check
          mode: blocking
          command: "test -n \"$(find docs/test-artifacts -type f -size +0c 2>/dev/null)\""
    output:
      produces:
        - id: tea-artifact
          kind: generic_file
      result:
        schema: ./schemas/public-result.v1.json
        required: true
        on_mismatch: retry
    rework:
      allowedTargets: [work]
      workspacePolicies: [keep, rewind-to-node-checkpoint]
      maxLoops: 2
      commentsVar: review_comments
    transitions:
      success: review
      retry: work

  - id: review
    type: human
    finish:
      human:
        role: maintainer
        decisions: [approve, rework, accept_risk]
        commentsVar: review_comments
    transitions:
      approve: done
      rework: work
      accept_risk: done
    rework:
      allowedTargets: [work]
      workspacePolicies: [keep, rewind-to-node-checkpoint]
      maxLoops: 3
      commentsVar: review_comments
