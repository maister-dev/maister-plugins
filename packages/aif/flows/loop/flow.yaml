schemaVersion: 1
name: aif-loop
metadata:
  title: "AIF — Reflex Loop"
  summary: "Quality-gated iterative authoring of one artifact: intake (budget + criteria) → /aif-loop reflex iterations (PLAN → PRODUCE‖PREPARE → EVALUATE → CRITIQUE → REFINE) → human review with a bounded rework loop."
  labels: [artifact, document, iterative]
  route_when: "A single non-code artifact (spec, doc, config, plan) that must be iterated against explicit quality criteria — not a feature/bugfix on the codebase."
  links:
    - { kind: framework, title: "AI Factory 2.19.0", url: "https://github.com/lee-to/ai-factory/tree/2.19.0" }
    - { kind: docs, title: "Dev Workflow", url: "https://github.com/lee-to/ai-factory/blob/2.x/docs/workflow.md" }
  sources:
    - { component: "skills/aif-*, agents/*", origin: "github.com/lee-to/ai-factory@2.19.0" }
# Runner intent only — no model or adapter pin; the running MAIster instance
# binds the slot to a host runner.
runner_profiles:
  primary:
    capability_agent: claude
    effort: high
# Typed artifacts → engine_min >= 1.2.0; M30 retry/session policies → >= 1.4.0.
# Pinned to the M42 2.0.0 engine baseline for this package release (single
# reused default session; no sessions: map needed).
compat:
  engine_min: 2.0.0
# M30 (ADR-081): pin the engine default explicitly — one ACP session reused
# across nodes, so the loop's on-disk run state stays warm across rework.
defaults:
  session_policy: resume
nodes:
  # Front-loaded loop parameters — MAIster-native HITL form; the loop node
  # runs unattended against these answers.
  - id: intake
    type: form
    settings:
      form_schema: ./schemas/loop-intake.json
    transitions:
      success: loop

  - id: loop
    type: ai_coding
    # M30 (ADR-080): auto-retry infra failures only; the workspace rewinds to
    # the pre-attempt checkpoint.
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      # `loop` is both the entry node and the review rework target. On entry
      # review_comments is empty (runner-seeded); on a rework jump it carries
      # the reviewer's feedback so the next loop round targets exactly what was
      # rejected.
      prompt: |
        @skill:aif-loop {{ task.prompt }}

        Unattended node inside a MAIster flow: human input reaches this run only
        through the flow's own review step, so run the full reflex loop from the
        intake parameters below until the quality gates pass or the iteration
        budget is exhausted, and record every non-obvious assumption in the
        artifact.

        Loop parameters from intake:
        - Iteration budget: {{ steps.intake.vars.iterations }}
        - Quality criteria: {{ steps.intake.vars.criteria }}
        ('-' means: derive the evaluation rules from the task itself.)

        If this workspace already holds a loop run for this task, resume it
        instead of starting a new one, and fold the reviewer feedback below
        into the evaluation rules for the next iterations.

        {{ review_comments }}
    output:
      produces:
        - id: loop-artifact
          kind: generic_file
          requiredFor: [review]
    transitions:
      success: review

  - id: review
    type: human
    pre_finish:
      gates:
        - id: loop-artifact-required
          kind: artifact_required
          mode: blocking
          inputArtifacts: [loop-artifact]
    finish:
      human:
        role: maintainer
        decisions: [approve, rework]
        commentsVar: review_comments
    transitions:
      approve: done
      rework: loop
    rework:
      allowedTargets: [loop]
      workspacePolicies: [keep]
      maxLoops: 3
      commentsVar: review_comments
