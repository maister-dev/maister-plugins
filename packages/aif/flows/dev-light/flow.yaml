schemaVersion: 1
name: aif-dev-light
metadata:
  title: "AIF — Develop (light)"
  summary: "aif-dev on one agent without the consensus, improve and cross-review passes: intake → plan (emits the typed Plan-review pair itself) → plan_review → TDD implement → verify → judge review with a bounded fix loop → human review → commit."
  labels: [feature, enhancement, refactor, light]
  route_when: "A small/clear feature or refactor where a single planning pass and a single reviewer are enough and the second agent would add cost without value."
  links:
    - { kind: framework, title: "AI Factory 2.19.0", url: "https://github.com/lee-to/ai-factory/tree/2.19.0" }
    - { kind: docs, title: "Dev Workflow", url: "https://github.com/lee-to/ai-factory/blob/2.x/docs/workflow.md" }
  sources:
    - { component: "skills/aif-*, agents/*", origin: "github.com/lee-to/ai-factory@2.19.0" }
# Runner intent only — no model or adapter pin; the running MAIster instance
# binds the slot to a host runner.
runner_profiles:
  primary:
    capability_agent: claude
    effort: high
  # Planning slot — bind it to the strongest model available on the host (for
  # example a fable-class runner): it drafts, synthesizes and refines the plan.
  planner:
    capability_agent: claude
    effort: high
# Typed Plan-review (3.1.0) + flow-level `reentry` (3.5.0); pinned to the
# 3.7.0 engine this package release was validated against.
compat:
  engine_min: 3.7.0
# An operator rework claim (ADR-160) re-enters the graph at `checks`.
reentry: checks
# M30 (ADR-081): rework re-entry resumes the prior ACP session by default; the
# review→fix loop below overrides with `session_policy: new_session`.
defaults:
  session_policy: resume
# M42 (ADR-114): planning, implementation, verification, fix and commit each
# run in their own ACP session — a phase never inherits another phase's
# context.
sessions:
  planning: { runner: planner }
  implement: { runner: primary }
  verify: { runner: primary }
  fix: { runner: primary }
  commit: { runner: primary }
# Flow-level calibration default, folded into the advisory ai_judgment gate at compile.
verdict_calibration:
  confidence_min: 0.7
nodes:
  # Preferences intake — MAIster-native HITL form. Everything a human decides
  # before planning is collected here; later nodes run unattended.
  - id: intake
    type: form
    settings:
      form_schema: ./schemas/intake.json
    transitions:
      success: plan

  # The light variant's one planning pass: /aif-plan plans AND emits the typed
  # Plan-review pair that aif-dev's separate /aif-improve node produces. `plan`
  # is also the plan_review rework target.
  - id: plan
    type: ai_coding
    session: planning
    # M30 (ADR-080): auto-retry infra failures only; the workspace rewinds to
    # the pre-attempt checkpoint. Same policy on every ai_coding node below.
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-plan full {{ task.prompt }}

        Handoff contract — the skill's own unattended mode; MAIster prepared the
        branch and worktree and there is no Handoff MCP:
        HANDOFF_MODE=1
        HANDOFF_BRANCH_PREPARED=1
        HANDOFF_BRANCH_NAME: the branch this worktree has checked out (read it
        with `git rev-parse --abbrev-ref HEAD`; MAIster created it, so the strict
        equality check holds by construction)
        HANDOFF_TASK_ID: empty (no plan annotation)
        Consequences: full mode, no branch or worktree operations, no Handoff
        MCP calls, and the plan file is named after the branch — that is how
        /aif-improve, /aif-implement and /aif-verify find it.

        Human input reaches this run only through the flow's own review steps.
        Preferences already answered at intake — Testing={{ steps.intake.vars.tests }}, Logging={{ steps.intake.vars.logging }}, Docs={{ steps.intake.vars.docs }};
        link a roadmap milestone only when the roadmap clearly names this work.
        Resolve everything else from the codebase and `.ai-factory/` context,
        record every non-obvious assumption in the plan, and leave genuinely
        blocking choices to the typed Plan-review decisions below.

        The task text may be a terse intent in any language. Keep it verbatim in
        `## Original Request` and add a `## Requirements Brief` (goal, in-scope,
        non-goals, affected contracts, data model, docs, testable acceptance
        criteria, assumptions) before the tasks, written in the project's
        artifact language (`language.artifacts`, English by default).

        Plan quality bar. Make the plan SDD-driven: accurately work on API
        contracts, DB migrations and system-analytics improvement/creation —
        migrations as SQL + journal + snapshot, contract and docs updates as
        plan tasks rather than follow-ups; allocate numbered artifacts (ADR,
        migration) from the base branch HEAD and list them in the plan header.
        Check the plan for fullness/completeness, consistency and logical-holes
        absence, concrete expectations, requirements and acceptance criteria.
        The implementation phase is TDD-based: every task names the tests
        written first; tests cover all required functionality and edge-case
        checks with minimum overlap and no trivial tests, and go through RED →
        GREEN → refactor.

        {{ plan_review_comments }}

        Typed Plan-review answers from a prior decision cycle (empty on first pass):
        {{ plan_review_answers }}

        This flow has no separate improve pass, so finish the planning pass by
        emitting the review pair yourself:
        Write the final Markdown implementation plan to $MAISTER_PLAN_DOCUMENT_FILE.
        Write its strict PlanReviewV1 JSON companion to $MAISTER_PLAN_REVIEW_FILE.
        Classify non-blocking assumptions separately from blocking decisions.
        Every decision offers 2-8 concrete options with stable ids, the
        consequences (pros/cons) of each, and the recommended option with its
        reason, written in the project's configured `language.ui`; never infer
        choices from prose or copy secret values into either artifact.
        $MAISTER_PLAN_REVIEW_FILE is validated strictly (PlanReviewV1, no extra
        keys): {"schemaVersion":1,"plan":{"title":"…","documentArtifact":"plan-document"},
        "assumptions":[{"id":"…","statement":"…","defaultDecision":{"id":"…","label":"…"},"impact":"…","blocking":false}],
        "decisions":[{"id":"…","question":"…","options":[{"id":"…","label":"…","consequences":"…"}],"recommendation":"<option id>","blocking":true}]}
        — ids match `^[a-z][a-z0-9_-]{0,63}$` and are unique across assumptions
        and decisions; 2-8 options per decision; up to 50 assumptions and 25
        decisions; `title` and every `label` ≤ 200 characters, `statement`,
        `impact` and `question` ≤ 4000, `consequences` ≤ 1000, none empty.
    output:
      produces:
        - id: plan-document
          kind: plan
          current: true
        - id: plan-review
          kind: plan
          current: true
    transitions:
      success: plan_review

  - id: plan_review
    type: human
    settings:
      plan_review:
        plan_document_artifact: plan-document
        plan_review_artifact: plan-review
        comments_var: plan_review_comments
        answers_var: plan_review_answers
        rework_transition: rework
        max_decision_reworks: 2
    finish:
      human:
        role: maintainer
        decisions: [approve, rework]
        commentsVar: plan_review_comments
    transitions:
      approve: implement
      rework: plan
    rework:
      allowedTargets: [plan]
      workspacePolicies: [keep]
      maxLoops: 3
      commentsVar: plan_review_comments

  - id: implement
    type: ai_coding
    # M42: fresh context — the approved plan is read from disk, not session memory.
    session: implement
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-implement

        HANDOFF_MODE=1
        HANDOFF_SKIP_REVIEW=0
        — the skill's own unattended mode (both values passed explicitly, as its
        detector requires): no Handoff MCP calls, no pause prompts, auto-commit
        at checkpoints; the plan is found by the branch name.

        Unattended node: execute the approved plan end to end — every task,
        every expectation, every acceptance criterion — resolving open points
        from the plan and the codebase and recording assumptions in the
        implementation summary. Tool-use permissions are handled by the
        platform.

        TDD per task: write the failing test first (RED), make it pass (GREEN),
        then refactor. Tests cover all required functionality and edge-case
        checks with minimum overlap and no trivial tests; integration tests run
        against real seams (real database, real entrypoints), never mocks of the
        thing under test. The implementation must be fully consistent with the
        specs and requirements, satisfy all acceptance criteria, turn the tests
        fully green, and follow SOLID, KISS, DRY and the project's code
        conventions. Surgical changes: every changed line traces to a plan task;
        fix pre-existing defects you hit inside a task's scope instead of filing
        TODOs; update the docs and contracts the plan names in the same
        increment. Commit at the plan's checkpoints with Conventional Commits;
        MAIster owns push and promotion.
    output:
      produces:
        - id: impl-diff
          kind: diff
          requiredFor: [review, merge]
    transitions:
      success: checks

  # Stack-agnostic verification (no hardcoded pnpm) — emits the gate result artifact.
  - id: checks
    type: ai_coding
    # M42: fresh verification context (the diff is read from disk).
    session: verify
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-verify

        Unattended node: verify the branch against the plan's acceptance
        criteria and the whole gate set the project defines (typecheck, lint,
        unit and integration suites, contract and docs validators where they
        exist). Never weaken assertions, skip, filter or widen timeouts to get
        green; a red suite is a finding: classify each failure as obsolete
        (delete it, with the reason) or broken (fix it). Report counts from the
        real runs, not adjectives.

        Answers to the skill's own questions: no plan artifact → "Verify branch
        diff" against the base branch; context drift → do not capture, report
        it; issues found → choose none of the four options ("Fix now", "Fix
        critical only", "Fix directly here", "Accept as-is"): report them in
        the Verification Report and the aif-gate-result and finish — the flow's
        fix and review nodes own the fixing; additional checks → skip.

        End your response with a single fenced `json maister:output` block that
        mirrors your aif-gate-result: {"status":"pass|warn|fail","review_comments":"..."}
        — "fail" when the gate result is fail (a failed required check or a
        blocking context gate; the flow then fixes and re-verifies), otherwise
        "pass" or "warn"; put the concrete blockers the next fix must address in
        review_comments.
    input:
      requires:
        - artifact: impl-diff
          kind: diff
    # Verification routes on its own structured status (ADR-103): a failed
    # required check or a blocking context gate goes back to `fix` with the
    # blockers, instead of riding into review as prose nobody consumes.
    output:
      result:
        schema: ./schemas/verify-outcome.json
        required: true
        on_mismatch: retry
      produces:
        - id: aif-gate-result
          kind: test_report
    decide:
      from: output.status
    transitions:
      pass: code_review
      warn: code_review
      fail: fix
      exhausted: review
    rework:
      allowedTargets: [fix]
      workspacePolicies: [keep]
      # Two consecutive red verifications in one epoch already warrant a human.
      maxLoops: 2
      session_policy: new_session
      commentsVar: review_comments
      onExhaustion: exhausted

  - id: code_review
    type: judge
    # M42: shares the verify session — reviews the same diff checks just gated.
    session: verify
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-review +check

        Review scope — this replaces the skill's argument routing (no staged-only
        default): all changes in this branch over the project base branch
        (`git.base_branch` from `.ai-factory/config.yaml`) — committed commits
        since the merge base plus the working tree, including untracked files.
        Answers to the skill's own questions: more than 20 commits → review all
        of them.

        Review specs and analytics for completeness, logical-holes absence and
        consistency, clear expectations, contracts and acceptance-criteria
        description; tests for functionality coverage, triviality absence and
        minimal overlap; UI designs for UX maturity; code for quality, full
        functionality readiness, specs-and-contracts consistency, SOLID, KISS,
        DRY principles and project code conventions following. Cite paths and
        lines for every finding.

        End your response with a single `maister:output` block per the skill's
        "Native flow routing output" section: recommend "fix" when there is any
        CRITICAL finding (the loop then fixes and re-verifies), or "commit" when
        there are none (non-critical suggestions ride along in review_comments
        and do NOT block). Put the concrete items the next fix must address in
        review_comments.
    input:
      requires:
        - artifact: impl-diff
          kind: diff
    # ADR-103 (M38): route on the judge's own structured output.
    output:
      result:
        schema: ./schemas/review-outcome.json
        required: true
    decide:
      from: output.recommendation
    transitions:
      fix: fix
      commit: review
      exhausted: review
    # ADR-118: the autonomous bounded review↔fix loop. On exhaustion the loop
    # routes to the human `review` (onExhaustion) so the accumulated worktree is
    # preserved.
    rework:
      allowedTargets: [fix]
      workspacePolicies: [keep]
      maxLoops: 5
      session_policy: new_session
      commentsVar: review_comments
      onExhaustion: exhausted
      # Every fix cycle re-visits `checks`; a judge-driven rework opens a fresh
      # epoch for it so its own visit cap never fires before this loop's does.
      resetTargets: [checks]

  - id: review
    type: human
    pre_finish:
      gates:
        - id: impl-diff-required
          kind: artifact_required
          mode: blocking
          inputArtifacts: [impl-diff]
        - id: ai-quality-advisory
          kind: ai_judgment
          mode: advisory
          prompt: >
            Assess the implementation diff against the task requirements.
            Reply with a JSON object:
            {"verdict":"pass"|"fail","confidence":0-1,"reasons":[...]}
    finish:
      human:
        role: maintainer
        decisions: [approve, rework, takeover]
        commentsVar: review_comments
    transitions:
      approve: commit
      rework: fix
      # Takeover returns at `checks` (NOT `commit`) so the human's local edits
      # are re-validated through /aif-verify + /aif-review before commit.
      takeover: checks
    rework:
      allowedTargets: [fix]
      # M30 (ADR-079): the reviewer picks — keep the tree as rejected, or
      # rewind to the pre-fix checkpoint for a clean re-attempt.
      workspacePolicies: [keep, rewind-to-node-checkpoint]
      maxLoops: 3
      commentsVar: review_comments
      # M42: each rework iteration re-enters `fix` on a fresh session.
      session_policy: new_session
      # ADR-118: a human rework re-baselines the code_review loop's attempt
      # counter → a fresh maxLoops budget.
      resetTargets: [checks, code_review]

  - id: fix
    type: ai_coding
    # M42: fresh rework context, focused on the review findings.
    session: fix
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-fix

        HANDOFF_MODE=1
        HANDOFF_TASK_ID: empty (no plan annotation)
        HANDOFF_SKIP_REVIEW=0
        — the skill's own unattended mode (all three values passed explicitly, as
        its detector requires): fix-now with a regression check, no Handoff MCP
        calls.

        Unattended node: address the findings below, resolving open points from
        the plan and the codebase and recording assumptions in the fix summary.
        Tool-use permissions are handled by the platform.

        Findings from the review loop or the human reviewer:
        {{ review_comments }}

        Verify every finding against the code before acting on it: fix the
        confirmed ones and state the refuting evidence for every rejected
        finding in your summary.

        Regression-first where a finding is behavioral: reproduce it with a
        failing test, then fix; keep the change surgical and the suites green.
    transitions:
      success: checks

  - id: commit
    type: ai_coding
    # M42: clean commit context — only the working tree matters here.
    session: commit
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-commit

        Commit the working tree as Conventional Commits — split by concern when
        the changes mix concerns, following the plan's Commit Plan when present.
        This node ends at a clean tracked tree; MAIster owns push, merge and
        promotion, so no push or branch operations.

        Answers to the skill's own questions: a Commit Plan in the active plan →
        follow it; proposed message → commit as is; unrelated work mixed in the
        staged changes → split as suggested; push to remote → no.
    pre_finish:
      gates:
        - id: commit-gate
          kind: command_check
          mode: blocking
          command: "test -z \"$(git status --porcelain --untracked-files=no)\" && git log -1 --pretty=%s | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([^)]+\\))?!?: .+'"
    transitions:
      success: done
