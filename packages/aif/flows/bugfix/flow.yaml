schemaVersion: 1
name: aif-bugfix
metadata:
  title: "AIF — Bugfix"
  summary: "Regression-first bug loop: fix → verify → judge review → adversarial cross-review by the second agent → bounded fix loops → human review → commit; emits a self-improvement patch."
  labels: [bug, hotfix, regression]
  route_when: "A reported bug/error/regression to fix."
  links:
    - { kind: framework, title: "AI Factory 2.19.0", url: "https://github.com/lee-to/ai-factory/tree/2.19.0" }
    - { kind: docs, title: "Dev Workflow", url: "https://github.com/lee-to/ai-factory/blob/2.x/docs/workflow.md" }
  sources:
    - { component: "skills/aif-*, agents/*", origin: "github.com/lee-to/ai-factory@2.19.0" }
# Runner intent only — no model or adapter pin; the running MAIster instance
# binds the slot to a host runner.
runner_profiles:
  primary:
    capability_agent: claude
    effort: high
  independent:
    capability_agent: codex
    effort: high
# Judge `decide` routing (1.7.0), rework onExhaustion/resetTargets (2.1.0),
# flow-level `reentry` (3.5.0); pinned to the 3.7.0 engine this package
# release was validated against.
compat:
  engine_min: 3.7.0
# An operator rework claim (ADR-160) re-enters the graph at `checks`.
reentry: checks
# M30 (ADR-081): rework re-entry resumes the prior ACP session by default; the
# review→fix loops below override with `session_policy: new_session`.
defaults:
  session_policy: resume
# M42 (ADR-114): implementation, verification, cross-review and commit each
# run in their own ACP session — a phase never inherits another phase's
# context.
sessions:
  implement: { runner: primary }
  verify: { runner: primary }
  cross: { runner: independent }
  commit: { runner: primary }
verdict_calibration:
  confidence_min: 0.7
nodes:
  - id: fix
    type: ai_coding
    session: implement
    # M30 (ADR-080): auto-retry infra failures only; the workspace rewinds to
    # the pre-attempt checkpoint. Same policy on every ai_coding node below.
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      # `fix` is both the entry node and every rework target. On entry
      # review_comments is empty (runner-seeded); on a rework jump it carries the
      # reviewer's feedback so the re-fix addresses exactly what was rejected.
      prompt: |
        @skill:aif-fix {{ task.prompt }}

        HANDOFF_MODE=1 with an empty HANDOFF_TASK_ID — the skill's own unattended
        mode: fix-now with a regression check, no Handoff MCP calls.

        Human input reaches this run only through the flow's own review step.
        Resolve open points from the report
        and the codebase, record every non-obvious assumption in the fix
        summary and the self-improvement patch, and keep the change surgical.
        Tool-use permissions are handled by the platform.

        Regression-first: reproduce the bug with the smallest failing check
        (RED), fix the root cause, then rerun the same check (GREEN) and the
        suites it touches. Tests cover the reported behavior and its edge cases
        with minimum overlap and no trivial tests; follow SOLID, KISS, DRY and
        the project's code conventions. Commit with Conventional Commits;
        MAIster owns push and promotion.

        Findings to address (from the judge review, the adversarial cross-review
        or the human reviewer):
        {{ review_comments }}

        Verify every finding against the code before acting on it — those
        marked `[cross-review]` come from the independent second agent and need
        this scrutiny most: fix the confirmed ones and state the refuting
        evidence for every rejected finding in your summary.
    output:
      produces:
        - id: impl-diff
          kind: diff
          requiredFor: [review, merge]
        - id: patch
          kind: generic_file
    transitions:
      success: checks

  - id: checks
    type: ai_coding
    session: verify
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-verify

        Unattended node: verify the fix against the reported behavior and the
        whole gate set the project defines (typecheck, lint, unit and
        integration suites, validators where they exist). Never weaken
        assertions, skip, filter or widen timeouts to get green; a red suite is
        a finding: classify each failure as obsolete (delete it, with the
        reason) or broken (fix it). Report counts from the real runs.

        Answers to the skill's own questions: no plan artifact → "Verify branch
        diff" against the base branch; context drift → do not capture, report
        it; issues found → report them in the Verification Report and the
        aif-gate-result and finish — never "Fix now", "Fix directly" or "Accept
        as-is" (the flow's fix and review nodes own that); additional checks →
        skip.
    input:
      requires:
        - artifact: impl-diff
          kind: diff
    output:
      produces:
        - id: aif-gate-result
          kind: test_report
    transitions:
      success: code_review

  - id: code_review
    type: judge
    session: verify
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-review +check

        Review scope — this replaces the skill's argument routing (no staged-only
        default): all changes in this branch over the project base branch
        (`git.base_branch` from `.ai-factory/config.yaml`) — committed commits
        since the merge base plus the working tree, including untracked files.
        Answers to the skill's own questions: more than 20 commits → review all
        of them.

        Review the fix against the reported bug: root cause actually removed
        (not the symptom), regression check present and discriminating, tests
        for functionality coverage, triviality absence and minimal overlap,
        code for quality, specs-and-contracts consistency, SOLID, KISS, DRY
        principles and project code conventions following. Cite paths and lines
        for every finding.

        End your response with a single `maister:output` block per the skill's
        "Native flow routing output" section: recommend "fix" when there is any
        CRITICAL finding (the loop then fixes and re-verifies), or "commit" when
        there are none (non-critical suggestions ride along in review_comments
        and do NOT block). Put the concrete items the next fix must address in
        review_comments.
    input:
      requires:
        - artifact: impl-diff
          kind: diff
    # ADR-103 (M38): route on the judge's own structured output.
    output:
      result:
        schema: ./schemas/review-outcome.json
        required: true
    decide:
      from: output.recommendation
    transitions:
      fix: fix
      commit: cross_review
      exhausted: review
    # ADR-118: the autonomous bounded review↔fix loop; exhaustion routes to the
    # human `review` so the accumulated worktree is preserved.
    rework:
      allowedTargets: [fix]
      workspacePolicies: [keep]
      maxLoops: 3
      session_policy: new_session
      commentsVar: review_comments
      onExhaustion: exhausted

  # Adversarial second opinion by the independent coding agent. Its findings
  # are verified by the fix node before anything is changed.
  - id: cross_review
    type: judge
    session: cross
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-review

        You are the independent second reviewer. Run a challenge review that
        questions the chosen implementation, design choices, trade-offs and
        assumptions — not just a stricter pass over defects. Stay read-only.

        Review scope — this replaces the skill's argument routing (no staged-only
        default): all changes in this branch over the project base branch
        (`git.base_branch` from `.ai-factory/config.yaml`) — committed commits
        since the merge base plus the working tree, including untracked files.
        Answers to the skill's own questions: more than 20 commits → review all
        of them.

        Review specs and analytics for completeness, logical-holes absence and
        consistency, clear expectations, contracts and acceptance-criteria
        description; tests for functionality coverage, triviality absence and
        minimal overlap; UI designs for UX maturity; code for quality, full
        functionality readiness, specs-and-contracts consistency, SOLID, KISS,
        DRY principles and project code conventions following. Cite paths and
        lines for every finding; the fix node verifies each one against the
        code before acting.

        End your response with a single `maister:output` block per the skill's
        "Native flow routing output" section: recommend "fix" when there is any
        CRITICAL finding, or "commit" when there are none. Put every finding the
        fix node must verify in review_comments and start that text with the
        marker `[cross-review]` — the fix node verifies marked findings against
        the code before acting on them.
    input:
      requires:
        - artifact: impl-diff
          kind: diff
    output:
      result:
        schema: ./schemas/review-outcome.json
        required: true
    decide:
      from: output.recommendation
    transitions:
      fix: fix
      commit: review
      exhausted: review
    rework:
      allowedTargets: [fix]
      workspacePolicies: [keep]
      maxLoops: 3
      session_policy: new_session
      # Shares `review_comments` with the judge and the human reviewer: the
      # engine injects the judge's own `review_comments` output var under the
      # rework commentsVar (vars[commentsVar]), so the var name must equal the
      # aif-review output key. Cross-review findings are told apart by their
      # `[cross-review]` marker.
      commentsVar: review_comments
      onExhaustion: exhausted

  - id: review
    type: human
    pre_finish:
      gates:
        - id: impl-diff-required
          kind: artifact_required
          mode: blocking
          inputArtifacts: [impl-diff]
        - id: ai-quality-advisory
          kind: ai_judgment
          mode: advisory
          prompt: >
            Assess the fix diff against the reported bug.
            Reply with a JSON object:
            {"verdict":"pass"|"fail","confidence":0-1,"reasons":[...]}
    finish:
      human:
        role: maintainer
        decisions: [approve, rework, takeover]
        commentsVar: review_comments
    transitions:
      approve: commit
      rework: fix
      # Takeover returns at `checks` so the human's local edits are re-verified
      # and re-reviewed before commit.
      takeover: checks
    rework:
      allowedTargets: [fix]
      # M30 (ADR-079): the reviewer picks — keep the tree as rejected, or
      # rewind to the pre-fix checkpoint for a clean re-attempt.
      workspacePolicies: [keep, rewind-to-node-checkpoint]
      maxLoops: 3
      commentsVar: review_comments
      session_policy: new_session
      # ADR-118: a human rework re-baselines both review loops' counters.
      resetTargets: [code_review, cross_review]

  - id: commit
    type: ai_coding
    session: commit
    retry_policy:
      attempts: 2
      on_errors: [SPAWN, EXECUTOR_UNAVAILABLE, CHECKPOINT, ACP_PROTOCOL]
      workspace: rewind-to-node-checkpoint
    action:
      prompt: |
        @skill:aif-commit

        Commit the working tree as Conventional Commits — split by concern when
        the changes mix concerns. This node ends at a clean tracked tree;
        MAIster owns push, merge and promotion, so no push or branch operations.

        Answers to the skill's own questions: a Commit Plan in the active plan →
        follow it; proposed message → commit as is; unrelated work mixed in the
        staged changes → split as suggested; push to remote → no.
    pre_finish:
      gates:
        - id: commit-gate
          kind: command_check
          mode: blocking
          command: "test -z \"$(git status --porcelain --untracked-files=no)\" && git log -1 --pretty=%s | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([^)]+\\))?!?: .+'"
    transitions:
      success: done
